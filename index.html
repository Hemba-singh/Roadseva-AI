    <!-- Suppress harmless Vite HMR WebSocket connection errors in preview container per environment constraints -->
    <script>
      (function() {
        var suppress = function(e) {
          var msg = (e && (e.message || (e.reason && e.reason.message) || String(e.reason || ''))) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1 || msg.indexOf('createWebSocketModuleRunnerTransport') !== -1 || (e && e.filename && e.filename.indexOf('@vite/client') !== -1)) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopPropagation) e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        };
        window.addEventListener('error', suppress, true);
        window.addEventListener('unhandledrejection', suppress, true);

        // Filter console.error for WebSocket transport errors
        if (typeof console !== 'undefined' && console.error) {
          var origError = console.error;
          console.error = function() {
            var str = '';
            for (var i = 0; i < arguments.length; i++) {
              str += ' ' + String(arguments[i] && arguments[i].message ? arguments[i].message : arguments[i]);
            }
            if (str.indexOf('WebSocket') !== -1 || str.indexOf('createWebSocketModuleRunnerTransport') !== -1 || str.indexOf('@vite/client') !== -1) {
              return;
            }
            return origError.apply(console, arguments);
          };
        }
      })();
    </script>
