<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#0055D4"/>
    </linearGradient>
    <linearGradient id="road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2C2C2E"/>
      <stop offset="100%" stop-color="#1C1C1E"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- Subtle Inner Border -->
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="6"/>

  <!-- Road Silhouette -->
  <path d="M 196 140 L 316 140 L 392 390 L 120 390 Z" fill="url(#road)" filter="url(#shadow)"/>

  <!-- Center Road Dashed Lines -->
  <path d="M 256 160 L 256 200" stroke="#FFD60A" stroke-width="12" stroke-linecap="round"/>
  <path d="M 256 230 L 256 280" stroke="#FFD60A" stroke-width="14" stroke-linecap="round"/>
  <path d="M 256 315 L 256 375" stroke="#FFD60A" stroke-width="16" stroke-linecap="round"/>

  <!-- AI Target Reticle / Scan Laser (Apple Vision style) -->
  <circle cx="280" cy="270" r="38" fill="none" stroke="#30D158" stroke-width="7" stroke-dasharray="14 10" opacity="0.95"/>
  <circle cx="280" cy="270" r="8" fill="#30D158"/>
  <path d="M 280 220 L 280 236 M 280 304 L 280 320 M 230 270 L 246 270 M 314 270 L 330 270" stroke="#30D158" stroke-width="6" stroke-linecap="round"/>

  <!-- Geolocation Pin Top Right -->
  <g transform="translate(320, 110)">
    <circle cx="28" cy="28" r="26" fill="#FF375F" filter="url(#shadow)"/>
    <path d="M 28 14 C 20 14 14 20 14 28 C 14 39 28 50 28 50 C 28 50 42 39 42 28 C 42 20 36 14 28 14 Z" fill="#FFFFFF"/>
    <circle cx="28" cy="26" r="5" fill="#FF375F"/>
  </g>
</svg>
